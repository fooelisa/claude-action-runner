name: Build and push container image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance:false stops build-push-action from attaching an attestation
      # manifest under the multi-arch index. GHCR's GC treats the attestation
      # digest as "untagged" and can prune it within minutes, breaking pulls
      # of the multi-arch parent. Same lesson as claude-workstation (see the
      # pik8s CLAUDE.md "Claude Code workstation" section).
      - name: Build and push (arm64 + amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-action-runner:main
            ghcr.io/${{ github.repository_owner }}/claude-action-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
