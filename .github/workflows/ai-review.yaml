# AI PR reviewer. See fooelisa/ci-workflows for the reusable workflow +
# fooelisa/claude-action-runner for the image + prompt. Runs on
# github-hosted runners, zero cluster impact.
#
# Requires the ANTHROPIC_API_KEY secret at repo level (fooelisa is a
# personal GitHub account, no org-level secrets available).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Required: caller must grant what the reusable workflow needs.
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write        # for the ai-review commit status (gates merge)

jobs:
  review:
    uses: fooelisa/ci-workflows/.github/workflows/ai-review.yaml@main
    secrets: inherit
